# Linux 用户：在同目录创建 .env 后运行 docker compose up -d
# Windows/macOS：不建议用 Docker，SSDP 组播无法穿透 VM 网络

services:
  miairx:
    image: jxydk/miairx:master
    container_name: miairx
    network_mode: host
    restart: unless-stopped
    environment:
      MI_USER: ${MI_USER:-}
      MI_PASS: ${MI_PASS:-}
      MI_DID: ${MI_DID:-}
      MIAIR_HOSTNAME: ${MIAIR_HOSTNAME:-}
      MIAIR_DLNA_PORT: ${MIAIR_DLNA_PORT:-8200}
      MIAIR_WEB_PORT: ${MIAIR_WEB_PORT:-8300}
      MIAIR_AIRPLAY_PORT_START: ${MIAIR_AIRPLAY_PORT_START:-7000}
    volumes:
      - ./conf:/app/conf
