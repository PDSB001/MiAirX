[project]
name = "miairx"
version = "1.7.0"
description = "Modern DLNA/AirPlay bridge for Xiaomi AI speakers"
readme = "README.md"
license = {text = "See LICENSE and THIRD_PARTY_NOTICES.md; bundled FairPlay declares GPLv2"}
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.0,<4",
    "miservice-fork>=2.9.0,<3",
    "zeroconf>=0.130.0,<1",
    "pycryptodome>=3.20.0,<4",
    "av>=16.1.0,<18",
    "structlog>=24.0.0,<25",
    "pydantic>=2.5.0,<3",
    "pydantic-settings>=2.1.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "srptools>=1.0.1,<2",  # Independent sender for HAP regression tests only.
    "ruff>=0.5.0",
    "pyright>=1.1.370",
]

[project.scripts]
miairx = "miairx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miairx"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "miairx/THIRD_PARTY_NOTICES.md"
"LICENSE" = "miairx/LICENSE"
"DISTRIBUTION_LICENSE.md" = "miairx/DISTRIBUTION_LICENSE.md"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/miairx/protocols/airplay/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v"
